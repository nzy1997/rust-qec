[package]
name = "qec-code"
version = "0.1.0"
edition = "2024"

[features]
default = []
distance-ilp-highs = ["dep:qec-ilp-core"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
qec-ilp-core = { path = "../qec-ilp-core", optional = true }

[dev-dependencies]
tempfile = "3"
