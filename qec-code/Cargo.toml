[package]
name = "qec-code"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Rust primitives for constructing and analyzing quantum error-correcting codes"
repository = "https://github.com/nzy1997/rstim"
readme = "README.md"

[features]
default = []
distance-ilp-highs = ["dep:qec-ilp-core"]
distance-ilp-gurobi = ["distance-ilp-highs", "qec-ilp-core/gurobi"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
qec-ilp-core = { version = "0.1.0", path = "../qec-ilp-core", optional = true }

[dev-dependencies]
tempfile = "3"
