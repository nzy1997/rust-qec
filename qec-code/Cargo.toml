[package]
name = "qec-code"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/qec-code"
publish = ["crates-io"]
include = ["/src/**", "/tests/**", "/examples/**", "/doc/**", "/assets/**", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]
description = "Rust primitives for constructing and analyzing quantum error-correcting codes"
repository = "https://github.com/nzy1997/rust-qec"
readme = "README.md"
autobins = false

[features]
default = []
cli = ["dep:clap"]
distance-ilp-highs = ["dep:qec-ilp-core", "qec-ilp-core/highs"]
distance-ilp-gurobi = ["dep:qec-ilp-core", "qec-ilp-core/gurobi"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
qec-ilp-core = { version = "0.1.0", path = "../qec-ilp-core", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "qec-code"
path = "src/main.rs"
required-features = ["cli"]
