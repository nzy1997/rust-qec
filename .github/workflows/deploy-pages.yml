name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install WebAssembly bindings tool
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - uses: Swatinem/rust-cache@v2

      - name: Install Zola
        run: |
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin zola
          zola --version

      - name: Build benchmarked documentation site
        run: make build-site

      - name: Check built site
        run: python3 tools/check_site_build.py _site

      - name: Install browser test engines
        run: |
          npm --prefix web/shot-viewer ci
          npx --prefix web/shot-viewer playwright install --with-deps chromium firefox

      - name: Test interactive shot viewer
        run: npm --prefix web/shot-viewer run test:e2e

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
