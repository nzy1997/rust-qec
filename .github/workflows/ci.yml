name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "7 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select CI scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_scope.py --event "$GITHUB_EVENT_NAME" --base "$CI_BASE_SHA"
      - name: Check tracked file policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          args=(--head "$HEAD_SHA")
          if [ "$EVENT_NAME" = pull_request ]; then
            args+=(--base "$PR_BASE_SHA")
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            args+=(--base "$HEAD_SHA^")
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            args+=(--base "$PUSH_BEFORE_SHA")
          else
            args+=(--base "$HEAD_SHA^")
          fi
          python3 tools/check_tracked_file_sizes.py "${args[@]}"
      - name: Fetch pinned benchmark artifacts
        if: steps.scope.outputs.rust == 'true'
        run: python3 tools/fetch_benchmark_artifacts.py
      - name: Install system deps
        if: steps.scope.outputs.rust == 'true'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*azure-cli*' -o -iname '*microsoft*' \) -delete
          for source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source_file"
            fi
          done
          sudo timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y pkg-config libfontconfig1-dev
      - name: Install Stim CLI
        if: steps.scope.outputs.rust == 'true'
        run: python3 -m pip install stim
      - name: Install Rust toolchain
        if: steps.scope.outputs.rust == 'true'
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.rust == 'true'
      - name: Test repository governance gates
        run: python3 -m unittest tools.test_check_repository_gate tools.test_check_release_gate tools.test_check_envelope_support tools.test_envelope_mle_scope tools.test_check_tracked_file_sizes tools.test_fetch_benchmark_artifacts tools.test_ci_scope
      - name: Minimal rsinter build, smoke, and dependency graph
        if: steps.scope.outputs.rust == 'true'
        run: |
          cargo build --locked -p rsinter --no-default-features --features rbposd-runner
          minimal_out="$(mktemp -d)"
          target/debug/rsinter bench run \
            --spec rsinter/tests/fixtures/bench/minimal_steane_css_rbposd.toml \
            --language rust \
            --out "$minimal_out"
          cargo tree --locked -p rsinter \
            --no-default-features --features rbposd-runner \
            --edges normal,build > /tmp/rsinter-minimal-tree.txt
          if rg -n '(rmatching|rilpqec|qec-ilp-core|highs|highs-sys|plotters)( |$)' /tmp/rsinter-minimal-tree.txt; then
            echo "ERROR: minimal dependency graph contains a disabled capability" >&2
            exit 1
          fi
          cargo test --locked -p rsinter --no-default-features --no-run
          cargo test --locked -p rsinter --no-default-features --features rbposd-runner
          rm -r "$minimal_out"
          rm /tmp/rsinter-minimal-tree.txt
      - name: Run workspace tests
        if: steps.scope.outputs.rust == 'true'
        run: make test
      - name: Check optional code-distance backend boundaries
        if: steps.scope.outputs.rust == 'true'
        run: |
          cargo test --locked -p qec-code --no-default-features --features distance-ilp-highs --test logical_distance --test distance_backend_features
      - name: Summarize selected tests
        env:
          RUST_TESTS: ${{ steps.scope.outputs.rust }}
        run: echo "Rust workspace tests selected=$RUST_TESTS; repository policy checks always run." >> "$GITHUB_STEP_SUMMARY"
  checked-evidence-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check portable evidence bundles
        run: |
          test ! -d target
          python3 tools/check_all_portable_evidence.py \
            --catalog benchmarks/rstim_vs_stim_simulator/evidence_bundles.toml
          test ! -d target
  publication-evidence-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check publication benchmark evidence bundle
        run: |
          test ! -d target
          make publication-evidence-check
          test ! -d target
  rsmp-v1-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*azure-cli*' -o -iname '*microsoft*' \) -delete
          for source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source_file"
            fi
          done
          sudo timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y pkg-config libfontconfig1-dev
      - name: Install Stim CLI
        run: python3 -m pip install stim
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked Cargo dependencies
        run: cargo fetch --locked
      - name: Run rsmp v1 readiness
        id: rsmp_readiness
        continue-on-error: true
        run: CARGO_NET_OFFLINE=true make rsmp-v1-readiness
      - name: Publish readiness failure summary
        if: always() && steps.rsmp_readiness.outcome != 'success'
        run: |
          echo "## rsmp v1 readiness failed" >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmarks/out/rsmp-v1/readiness.json ]; then
            python3 -c 'import json; d=json.load(open("benchmarks/out/rsmp-v1/readiness.json")); print("- status:", d.get("status")); print("- failed checks:", ", ".join(c.get("check", "?") for c in d.get("failed_checks", [])) or "none")' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- readiness.json was not produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload rsmp v1 readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsmp-v1-readiness
          path: benchmarks/out/rsmp-v1/
      - name: Fail on rsmp v1 readiness error
        if: steps.rsmp_readiness.outcome != 'success'
        run: exit 1
  perf-gate:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-perf'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*azure-cli*' -o -iname '*microsoft*' \) -delete
          for source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source_file"
            fi
          done
          sudo timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y pkg-config libfontconfig1-dev
      - name: Install Stim CLI
        run: python3 -m pip install stim
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Run perf CI pipeline
        id: perf_ci
        continue-on-error: true
        run: |
          mkdir -p perf-artifacts
          cargo run --locked -p rstim --features cli --bin rstim -- perf ci --out-dir perf-artifacts
      - name: Publish perf report
        if: always()
        run: |
          if [ -f perf-artifacts/report.md ]; then
            cat perf-artifacts/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rstim-perf-artifacts
          path: perf-artifacts/
      - name: Fail on perf gate error
        if: steps.perf_ci.outcome != 'success'
        run: exit 1
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select CI scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_scope.py --event "$GITHUB_EVENT_NAME" --base "$CI_BASE_SHA"
      - name: Install system deps
        if: steps.scope.outputs.coverage == 'true'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*azure-cli*' -o -iname '*microsoft*' \) -delete
          for source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source_file"
            fi
          done
          sudo timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y pkg-config libfontconfig1-dev
      - name: Install Stim CLI
        if: steps.scope.outputs.coverage == 'true'
        run: python3 -m pip install stim
      - name: Install Rust toolchain
        if: steps.scope.outputs.coverage == 'true'
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.coverage == 'true'
      - name: Install cargo-llvm-cov
        if: steps.scope.outputs.coverage == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        if: steps.scope.outputs.coverage == 'true'
        run: cargo llvm-cov --locked --workspace --features rstim/ilp,rsinter/full,rstim/benchmark-tools,rstim/cli,rstim/codegen-css,rstim/shot-viewer,qec-code/cli,qec-ilp-core/highs --lcov --output-path lcov.info --ignore-filename-regex 'rbposd/dev/fixture_catalog\.rs$'
      - name: Upload to Codecov
        if: steps.scope.outputs.coverage == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Summarize coverage policy
        run: echo "Coverage is generated on master pushes, scheduled runs, and manual runs. PRs use the workspace test gate." >> "$GITHUB_STEP_SUMMARY"
