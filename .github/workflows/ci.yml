name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*azure-cli*' -o -iname '*microsoft*' \) -delete
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Install Stim CLI
        run: python3 -m pip install stim
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Minimal rsinter build, smoke, and dependency graph
        run: |
          cargo build --locked -p rsinter --no-default-features --features rbposd-runner
          minimal_out="$(mktemp -d)"
          target/debug/rsinter bench run \
            --spec rsinter/tests/fixtures/bench/minimal_steane_css_rbposd.toml \
            --language rust \
            --out "$minimal_out"
          cargo tree --locked -p rsinter \
            --no-default-features --features rbposd-runner \
            --edges normal,build > /tmp/rsinter-minimal-tree.txt
          if rg -n '(rmatching|rilpqec|qec-ilp-core|highs|highs-sys|plotters)( |$)' /tmp/rsinter-minimal-tree.txt; then
            echo "ERROR: minimal dependency graph contains a disabled capability" >&2
            exit 1
          fi
          cargo test --locked -p rsinter --no-default-features --no-run
          cargo test --locked -p rsinter --no-default-features --features rbposd-runner
          rm -r "$minimal_out"
          rm /tmp/rsinter-minimal-tree.txt
      - name: Install system dependencies
        run: sudo apt-get install -y libfontconfig1-dev
      - run: cargo test --locked --workspace
  checked-evidence-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check portable evidence bundles
        run: |
          test ! -d target
          python3 tools/check_all_portable_evidence.py \
            --catalog benchmarks/rstim_vs_stim_simulator/evidence_bundles.toml
          test ! -d target
  perf-gate:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-perf'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*azure-cli*' -o -iname '*microsoft*' \) -delete
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Install Stim CLI
        run: python3 -m pip install stim
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Run perf CI pipeline
        id: perf_ci
        continue-on-error: true
        run: |
          mkdir -p perf-artifacts
          cargo run --locked -p rstim --bin rstim -- perf ci --out-dir perf-artifacts
      - name: Publish perf report
        if: always()
        run: |
          if [ -f perf-artifacts/report.md ]; then
            cat perf-artifacts/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rstim-perf-artifacts
          path: perf-artifacts/
      - name: Fail on perf gate error
        if: steps.perf_ci.outcome != 'success'
        run: exit 1
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*azure-cli*' -o -iname '*microsoft*' \) -delete
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Install Stim CLI
        run: python3 -m pip install stim
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get install -y libfontconfig1-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info --ignore-filename-regex 'rbposd/dev/fixture_catalog\.rs$'
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
