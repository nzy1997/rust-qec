name: Native support

on:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'Makefile'
      - 'rstim/assets/**'
      - 'rsinter/configs/**'
      - 'tools/*native_support*'
      - 'docs/support-compatibility.md'
      - '.github/workflows/native-support.yml'
    branches: [master]
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'Makefile'
      - 'rstim/assets/**'
      - 'rsinter/configs/**'
      - 'tools/*native_support*'
      - 'docs/support-compatibility.md'
      - '.github/workflows/native-support.yml'
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "13 2 * * 1"
  workflow_dispatch:

concurrency:
  group: native-support-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-support:
    name: Native support / ${{ matrix.cell_prefix }}-${{ matrix.toolchain == 'stable' && 'stable' || 'msrv' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
        toolchain: ['1.88.0', stable]
        exclude:
          - runner: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'none' }}
            toolchain: stable
          - runner: ${{ github.event_name == 'pull_request' && 'macos-15' || 'none' }}
            toolchain: '1.88.0'
        include:
          - runner: ubuntu-24.04
            cell_prefix: ubuntu-24.04-x86_64
            runner_os: Linux
            runner_arch: X64
            machine: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            cell_prefix: macos-15-aarch64
            runner_os: macOS
            runner_arch: ARM64
            machine: arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      NATIVE_CELL: ${{ matrix.cell_prefix }}-${{ matrix.toolchain == 'stable' && 'stable' || 'msrv' }}
      EXPECTED_RUNNER_OS: ${{ matrix.runner_os }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      EXPECTED_TARGET: ${{ matrix.target }}
      REQUESTED_TOOLCHAIN: ${{ matrix.toolchain }}
      RUNNER_LABEL: ${{ matrix.runner }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libclang-dev pkg-config libfontconfig1-dev python3-venv
      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake fontconfig pkg-config python
      - name: Install Stim in an isolated Python environment
        run: |
          python3 -m venv .venv-native-support
          .venv-native-support/bin/python -m pip install stim
          echo "$PWD/.venv-native-support/bin" >> "$GITHUB_PATH"
      - name: Select the exact Rust toolchain
        run: |
          rustup toolchain install "$REQUESTED_TOOLCHAIN" --profile minimal
          rustc_path="$(rustup which --toolchain "$REQUESTED_TOOLCHAIN" rustc)"
          rustdoc_path="$(rustup which --toolchain "$REQUESTED_TOOLCHAIN" rustdoc)"
          cargo_path="$(rustup which --toolchain "$REQUESTED_TOOLCHAIN" cargo)"
          {
            echo "RUSTC=$rustc_path"
            echo "RUSTDOC=$rustdoc_path"
            echo "CARGO=$cargo_path"
          } >> "$GITHUB_ENV"
      - name: Verify runner and compiler identity
        run: |
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          "$RUSTC" --version --verbose
          test "$("$RUSTC" --print host-tuple)" = "$EXPECTED_TARGET"
          test "$(rustup which --toolchain "$REQUESTED_TOOLCHAIN" rustc)" = "$RUSTC"
          if [ "$REQUESTED_TOOLCHAIN" != stable ]; then
            test "$("$RUSTC" --version | awk '{print $2}')" = "$REQUESTED_TOOLCHAIN"
          fi
      - name: Run the one-qubit CLI integration fixture
        run: |
          "$CARGO" test --locked -p rstim --test unified_cli \
            circuit_stats_json_wraps_the_existing_rstim_result -- --exact
      - name: Run locked workspace tests
        run: |
          "$CARGO" test --locked --workspace --features rstim/ilp,rsinter/full,rstim/benchmark-tools,rstim/cli,rstim/codegen-css,rstim/shot-viewer,qec-code/cli,qec-ilp-core/highs
      - name: Run the real one-qubit CLI workflow
        run: |
          mkdir -p native-support-evidence
          printf 'M 0\nDETECTOR rec[-1]\n' | \
            "$CARGO" run --locked -p rstim --bin rstim -- \
              circuit stats --format json > native-support-evidence/cli.json
          python3 -c 'import json; d=json.load(open("native-support-evidence/cli.json")); r=d["result"]; assert (r["num_qubits"], r["num_measurements"], r["num_detectors"]) == (1, 1, 1)'
      - name: Record native support evidence
        run: |
          python3 tools/record_native_support_cell.py \
            --cell "$NATIVE_CELL" \
            --runner-label "$RUNNER_LABEL" \
            --expected-target "$EXPECTED_TARGET" \
            --toolchain "$REQUESTED_TOOLCHAIN" \
            --cli-json native-support-evidence/cli.json \
            --out native-support-evidence/evidence.json
      - name: Upload native support evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-support-${{ matrix.cell_prefix }}-${{ matrix.toolchain == 'stable' && 'stable' || 'msrv' }}
          path: native-support-evidence/evidence.json
          if-no-files-found: error
