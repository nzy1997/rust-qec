name: Interactive shot quality

on:
  pull_request:
    paths:
      - "README*"
      - "*/README*"
      - "docs/showcases/**"
      - "qp101-viz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "rstim/Cargo.toml"
      - "rstim/src/cli.rs"
      - "rstim/src/executor.rs"
      - "rstim/src/interactive_shot.rs"
      - "rstim/src/lib.rs"
      - "rstim/src/qp101_svg.rs"
      - "rstim/src/shot_viewer.rs"
      - "rstim/assets/shot-viewer/**"
      - "rstim-shot-web/**"
      - "tools/build_shot_viewer.sh"
      - "tools/shot_viewer_assets.py"
      - "tools/prepare_site_docs.py"
      - "tools/serve_site.py"
      - "tools/site_versions.py"
      - "tools/test_site_versions.py"
      - "tools/test_prepare_site_docs.py"
      - ".github/workflows/deploy-pages.yml"
      - "tools/build_docs_search.py"
      - "tools/build_cli_reference.py"
      - "tools/test_build_docs_search.py"
      - "tools/test_build_cli_reference.py"
      - "tools/test_docs_examples.py"
      - "tools/test_docs_guides.py"
      - "tools/test_atom_loss_guide.py"
      - "tools/test_install_script.py"
      - "docs/support-compatibility.md"
      - "docs/maintainer-reference.md"
      - "rstim/doc/**"
      - "site/**"
      - "web/shot-viewer/**"
      - "fuzz/**"
      - ".github/workflows/interactive-shot-quality.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: interactive-shot-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/shot-viewer/package-lock.json
      - name: Install build tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin zola
      - name: Check documentation build contracts
        run: python3 -m unittest tools.test_build_cli_reference tools.test_build_docs_search tools.test_docs_examples tools.test_docs_guides tools.test_install_script tools.test_prepare_site_docs tools.test_site_app_rendering tools.test_check_site_build tools.test_check_site_manifest tools.test_site_versions tools.test_atom_loss_guide
      - name: Build site and install browsers
        run: |
          cargo test -p rstim --test interactive_shot_properties
          cargo test -p rstim-shot-web
          make build-site
          cargo test --locked -p rstim --test site_contract --test workspace_brand --test site_gallery
          python3 tools/check_site_build.py _site --repo-root .
          npm --prefix web/shot-viewer ci
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*azure-cli*' -o -iname '*microsoft*' \) -delete
          for source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source_file"
            fi
          done
          timeout 10m npx --prefix web/shot-viewer playwright install --with-deps chromium firefox
      - name: Run browser and export tests
        run: npm --prefix web/shot-viewer run test:e2e
      - name: Upload browser review screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-review
          path: web/shot-viewer/test-results/
          retention-days: 14
          if-no-files-found: ignore
