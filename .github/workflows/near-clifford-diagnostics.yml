name: Near-Clifford diagnostic evidence

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: near-clifford-diagnostics-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  producer-smoke:
    # Run collection only for the evidence campaign and the native counts follow-up.
    # Historical v1 publications remain frozen; v2 binds optimized source bytes.
    if: github.head_ref == 'codex/near-clifford-diagnostic-benchmarks' || github.head_ref == 'codex/near-clifford-native-counts' || github.head_ref == 'codex/near-clifford-counts-rejection' || github.head_ref == 'codex/near-clifford-packet-rejection' || github.head_ref == 'codex/near-clifford-linear-counts' || github.head_ref == 'codex/near-clifford-compact-counts-replay' || github.head_ref == 'codex/near-clifford-cache-reconvergence-scout'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SYMFT_PY_ENABLE_CUDA: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned smoke backends
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
          python -m venv drafts/ci-clifft
          drafts/ci-clifft/bin/python -m pip install numpy==2.4.6 clifft==0.11.0
          python -m venv drafts/ci-symft
          drafts/ci-symft/bin/python -m pip install numpy==2.4.6 setuptools==80.9.0 wheel==0.45.1
          git clone https://github.com/haoliri0/SOFT.git drafts/ci-soft
          git -C drafts/ci-soft checkout c89b98514a919240b8afa53a271e08d926d3c987
          drafts/ci-symft/bin/python -m pip install --no-build-isolation drafts/ci-soft/python
      - name: Validate bounded lossless event storage
        run: |
          python benchmarks/near_clifford/test_evidence_io.py
          python -O benchmarks/near_clifford/test_evidence_io.py
      - name: Exercise native counts metadata and independent raw oracle
        run: |
          python benchmarks/near_clifford/application_counts/run.py \
            --out drafts/ci-counts-smoke \
            --python "$PWD/drafts/ci-clifft/bin/python" \
            --symft-python "$PWD/drafts/ci-symft/bin/python" \
            --symft-source "$PWD/drafts/ci-soft" \
            --only msc_d3_inject_cultivate_p1e-3 pure_surface_d7_r7_p1e-3 --shots 1 64 --pairs 1 --repetitions 1
          python benchmarks/near_clifford/application_counts/verify.py drafts/ci-counts-smoke --git-sources --allow-smoke
          python -O benchmarks/near_clifford/application_counts/verify.py drafts/ci-counts-smoke --git-sources --allow-smoke
          python benchmarks/near_clifford/application_counts/test_contract.py drafts/ci-counts-smoke
          python -O benchmarks/near_clifford/application_counts/test_contract.py drafts/ci-counts-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: near-clifford-counts-producer-smoke-${{ github.sha }}
          path: drafts/ci-counts-smoke/
          retention-days: 14
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            benchmarks/near_clifford/diagnostics -> target
            benchmarks/near_clifford/application_counts -> target
      - name: Check isolated public-API probes
        run: |
          cargo fmt --manifest-path benchmarks/near_clifford/diagnostics/Cargo.toml --check
          cargo fmt --manifest-path benchmarks/near_clifford/application_counts/Cargo.toml --check
          cargo check --locked --manifest-path benchmarks/near_clifford/diagnostics/Cargo.toml
          cargo check --locked --manifest-path benchmarks/near_clifford/application_counts/Cargo.toml
      - name: Replay formal diagnostic evidence and source identities
        run: |
          for campaign in cache-lifetime boundary structure; do
            evidence="benchmarks/near_clifford/results/apple-m4-diagnostics-${campaign}-2026-10-07"
            python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --check
            python3 -O benchmarks/near_clifford/diagnostics/verify.py "$evidence" --git-sources
          done
          for campaign in cache-lifetime boundary rank structure-incumbent; do
            evidence="benchmarks/near_clifford/results/linux-vm-x86-diagnostics-${campaign}-2026-10-07"
            python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --check
            python3 -O benchmarks/near_clifford/diagnostics/verify.py "$evidence" --git-sources
          done
          for host in apple-m4 linux-vm-x86; do
            evidence="benchmarks/near_clifford/results/${host}-application-counts-2026-10-07"
            python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
            python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
          done
          evidence=benchmarks/near_clifford/results/apple-m4-native-counts-2026-10-07
          python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
          python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
          evidence=benchmarks/near_clifford/results/apple-m4-scalar-rejection-one-shot-2026-10-07
          python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
          python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
          evidence=benchmarks/near_clifford/results/apple-m4-counts-annotations-2026-10-08
          python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
          python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
          evidence=benchmarks/near_clifford/results/apple-m4-packed-rejection-2026-10-08
          python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
          python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
          evidence=benchmarks/near_clifford/results/apple-m4-affine-counts-2026-10-08
          python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
          python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
          evidence=benchmarks/near_clifford/results/linux-vm-x86-affine-counts-2026-10-08
          python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
          python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
          evidence=benchmarks/near_clifford/results/apple-m4-counts-replay-2026-10-08
          python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
          python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
          evidence=benchmarks/near_clifford/results/linux-vm-x86-counts-replay-2026-10-08
          python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
          python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
      - name: Replay bounded coefficient-intern scouts and full publications
        run: |
          python3 benchmarks/near_clifford/verify_coefficient_intern_scouts.py
          python3 -O benchmarks/near_clifford/verify_coefficient_intern_scouts.py
          python3 benchmarks/near_clifford/test_coefficient_intern_scouts.py
          python3 -O benchmarks/near_clifford/test_coefficient_intern_scouts.py
          for host in apple-m4 linux-vm-x86; do
            evidence="benchmarks/near_clifford/results/${host}-coefficient-intern-2026-10-08"
            python3 benchmarks/near_clifford/analyze_diagnostics.py "$evidence" --kind application_counts --check
            python3 benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
            python3 -O benchmarks/near_clifford/application_counts/verify.py "$evidence" --git-sources
          done
  diagnostic-corruption:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject resealed diagnostic corruption
        env:
          PYTHON_MODE: ${{ matrix.mode }}
        run: |
          python_flags=()
          if [[ "$PYTHON_MODE" == optimized ]]; then python_flags=(-O); fi
          evidence=benchmarks/near_clifford/results/apple-m4-diagnostics-cache-lifetime-2026-10-07
          python3 "${python_flags[@]}" benchmarks/near_clifford/diagnostics/test_contract.py "$evidence"
  counts-corruption:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
        publication: [apple-m4-application-counts-2026-10-07, apple-m4-native-counts-2026-10-07, apple-m4-scalar-rejection-one-shot-2026-10-07, apple-m4-counts-annotations-2026-10-08, apple-m4-packed-rejection-2026-10-08, apple-m4-affine-counts-2026-10-08, apple-m4-counts-replay-2026-10-08, apple-m4-coefficient-intern-2026-10-08, linux-vm-x86-coefficient-intern-2026-10-08]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject resealed application counts corruption
        env:
          PYTHON_MODE: ${{ matrix.mode }}
          PUBLICATION: ${{ matrix.publication }}
        run: |
          python_flags=()
          if [[ "$PYTHON_MODE" == optimized ]]; then python_flags=(-O); fi
          evidence="benchmarks/near_clifford/results/$PUBLICATION"
          python3 "${python_flags[@]}" benchmarks/near_clifford/application_counts/test_contract.py "$evidence"
