name: Near-Clifford raw profile replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  raw-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux symbolic decoder tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
      - name: Re-export the exact original raw samples
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p drafts
          python3 -I -B benchmarks/near_clifford/cdf_perf_replay.py \
            --out "$PWD/drafts/raw-profile-replay" \
            > drafts/raw-profile-replay.log 2>&1
      - name: Retain complete replay results and partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: near-clifford-raw-replay-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            drafts/raw-profile-replay.log
            drafts/raw-profile-replay/
