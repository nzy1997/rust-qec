name: Interactive shot fuzz

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'rstim/Cargo.toml'
      - 'rstim/src/**'
      - 'rstim/assets/**'
      - 'fuzz/**'
      - '.github/workflows/interactive-shot-fuzz.yml'
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactive-shot-fuzz-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - interactive_open
          - interactive_event_ids
          - interactive_commands
          - interactive_qp101_svg
          - interactive_svg_escape
    steps:
      - uses: actions/checkout@v4
      - name: Install fuzz toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
      - name: Run deterministic fuzz budget
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '60' || '5' }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time="$FUZZ_SECONDS" -seed=7
