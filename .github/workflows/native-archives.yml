name: Native release archives

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build
        required: true
        default: v0.3.0
        type: string
      publish:
        description: Upload verified assets to the existing GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: native-archives-${{ github.event.pull_request.number || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      staging: ${{ steps.identity.outputs.staging }}
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Checkout immutable build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.tag }}
          fetch-depth: 0
          path: source
      - name: Resolve source identity
        id: identity
        working-directory: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [ -n "$PR_HEAD_SHA" ]; then
            tag="staging-${source_sha}"
            git tag "$tag" "$source_sha"
            staging=true
          else
            tag="$REQUESTED_TAG"
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$source_sha"
            staging=false
          fi
          {
            echo "tag=$tag"
            echo "source_sha=$source_sha"
            echo "staging=$staging"
          } >> "$GITHUB_OUTPUT"
      - name: Apply the release gate to a production tag
        if: github.event_name == 'workflow_dispatch'
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          python3 tooling/tools/check_release_gate.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --dry-run \
            --wait-seconds 2700 \
            --poll-seconds 20 \
            --github-output "$GITHUB_OUTPUT"
      - name: Confirm the release gate resolved the build source
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${{ steps.identity.outputs.source_sha }}" = "${{ steps.release_gate.outputs.commit }}"

  checker-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tools.test_verify_release_archive
      - run: python3 -m unittest tools.test_check_envelope_publication

  shot-assets:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Checkout immutable build source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          path: source
      - name: Restore the ephemeral staging tag
        if: needs.prepare.outputs.staging == 'true'
        working-directory: source
        run: git tag "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.source_sha }}"
      - name: Install the WebAssembly compiler prerequisite
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Select stable Rust exactly
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable wasm32-unknown-unknown
          {
            echo "RUSTC=$(rustup which --toolchain stable rustc)"
            echo "RUSTDOC=$(rustup which --toolchain stable rustdoc)"
            echo "CARGO=$(rustup which --toolchain stable cargo)"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/source/target"
            echo "SOURCE_DATE_EPOCH=$(git -C source show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"
      - name: Install the pinned WebAssembly binding tool
        run: |
          "$(rustup which --toolchain stable cargo)" install wasm-bindgen-cli --version 0.2.126 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Rebuild the shared embedded Shot Lab assets from the tag
        env:
          SHOT_VIEWER_REPO_ROOT: ${{ github.workspace }}/source
        run: |
          WASM_BINDGEN="$HOME/.cargo/bin/wasm-bindgen" tooling/tools/build_shot_viewer.sh
          python3 source/tools/shot_viewer_assets.py
          tar -czf rebuilt-shot-lab-assets.tar.gz -C source \
            site/static/interactive/app.js \
            site/static/interactive/pkg/rstim_shot_web.d.ts \
            site/static/interactive/pkg/rstim_shot_web.js \
            site/static/interactive/pkg/rstim_shot_web_bg.wasm \
            site/static/interactive/pkg/rstim_shot_web_bg.wasm.d.ts \
            site/static/interactive/shot-viewer.css \
            rstim/assets/shot-viewer/app.js \
            rstim/assets/shot-viewer/asset-manifest.json \
            rstim/assets/shot-viewer/pkg/rstim_shot_web_bg.wasm \
            rstim/assets/shot-viewer/shot-viewer.css
      - name: Upload one shared rebuilt asset set
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-shot-lab-assets
          path: rebuilt-shot-lab-assets.tar.gz
          if-no-files-found: error

  build:
    needs: [prepare, shot-assets]
    name: Build archive / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      RELEASE_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Checkout immutable build source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          path: source
      - name: Restore the ephemeral staging tag
        if: needs.prepare.outputs.staging == 'true'
        working-directory: source
        run: git tag "$RELEASE_TAG" "$SOURCE_SHA"
      - name: Verify the production tag is present
        if: needs.prepare.outputs.staging != 'true'
        working-directory: source
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake libclang-dev pkg-config libfontconfig1-dev
      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake fontconfig pkg-config
      - name: Select stable Rust exactly
        run: |
          rustup toolchain install stable --profile minimal
          {
            echo "RUSTC=$(rustup which --toolchain stable rustc)"
            echo "RUSTDOC=$(rustup which --toolchain stable rustdoc)"
            echo "CARGO=$(rustup which --toolchain stable cargo)"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/source/target"
            echo "SOURCE_DATE_EPOCH=$(git -C source show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Download the shared assets rebuilt from the tag
        uses: actions/download-artifact@v4
        with:
          name: rebuilt-shot-lab-assets
          path: rebuilt-shot-assets
      - name: Apply and verify the rebuilt Shot Lab assets
        run: |
          tar -xzf rebuilt-shot-assets/rebuilt-shot-lab-assets.tar.gz -C source
          python3 source/tools/shot_viewer_assets.py
      - name: Build the two native CLIs from the locked source
        run: |
          # Enable full CLI capabilities when present; immutable older tags have no such features.
          full_features=()
          for capability in rustqec-cli/ilp rstim/cli rstim/codegen-css rstim/shot-viewer; do
            package="${capability%%/*}"
            feature="${capability#*/}"
            if python3 -c 'import sys,tomllib; d=tomllib.load(open(sys.argv[1], "rb")); raise SystemExit(0 if sys.argv[2] in d.get("features", {}) else 1)' "source/$package/Cargo.toml" "$feature"; then
              full_features+=(--features "$capability")
            fi
          done
          "$CARGO" build --locked --release \
            --manifest-path source/Cargo.toml \
            -p rustqec-cli --bin rustqec \
            -p rstim --bin rstim "${full_features[@]}"
      - name: Record native runtime linkage
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            {
              echo "rustqec:"
              ldd source/target/release/rustqec | sed -E 's/ \(0x[0-9a-f]+\)//g'
              echo "rstim:"
              ldd source/target/release/rstim | sed -E 's/ \(0x[0-9a-f]+\)//g'
            } > runtime-linkage.txt
          else
            {
              echo "rustqec:"
              otool -L source/target/release/rustqec
              echo "rstim:"
              otool -L source/target/release/rstim
            } > runtime-linkage.txt
          fi
          cat runtime-linkage.txt
      - name: Package the target archive
        run: |
          mkdir -p staged-target
          python3 tooling/tools/build_release_archive.py package \
            --repo-root source \
            --out-dir staged-target \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --target "$RELEASE_TARGET" \
            --cargo "$CARGO" \
            --rustc "$RUSTC" \
            --rustqec source/target/release/rustqec \
            --rstim source/target/release/rstim \
            --runtime-linkage runtime-linkage.txt
      - name: Upload the target staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-archive-fragment-${{ matrix.target }}
          path: staged-target/
          if-no-files-found: error

  aggregate:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Checkout the frozen installed-quickstart contract
        uses: actions/checkout@v4
        with:
          ref: f5dc754f73d2eb54459c1dffc282e717fd02d610
          path: quickstart-tooling
          sparse-checkout: tools/check_installed_quickstart.py
          sparse-checkout-cone-mode: false
      - name: Download target staging artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-archive-fragment-*
          path: staged-targets
          merge-multiple: true
      - name: Assemble checksums and release manifest
        run: |
          python3 tooling/tools/build_release_archive.py assemble \
            --fragments staged-targets \
            --out-dir staged-release \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --source-sha "${{ needs.prepare.outputs.source_sha }}"
          cp tooling/tools/verify_release_archive.py staged-release/
          cp quickstart-tooling/tools/check_installed_quickstart.py staged-release/
      - name: Upload the complete staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: native-release-bundle
          path: staged-release/
          if-no-files-found: error

  envelope-installed:
    needs: [prepare, aggregate]
    name: Envelope installed check / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Download staged release bundle
        uses: actions/download-artifact@v4
        with:
          name: native-release-bundle
          path: staged-release
      - name: Verify and extract the target archive
        run: |
          set -euo pipefail
          archive="staged-release/rustqec-${RELEASE_TAG}-${RELEASE_TARGET}.tar.gz"
          python3 staged-release/verify_release_archive.py \
            --archive "$archive" \
            --checksums staged-release/SHA256SUMS \
            --manifest staged-release/release-manifest.json \
            --expected-tag "$RELEASE_TAG"
          root="$(basename "$archive" .tar.gz)"
          PYTHONPATH=staged-release python3 - "$archive" "$root" <<'PY'
          import sys
          from pathlib import Path
          from verify_release_archive import safe_extract
          safe_extract(Path(sys.argv[1]), Path("extracted"), sys.argv[2])
          PY
      - name: Test the installed archive against the envelope contract
        run: |
          set -euo pipefail
          archive="staged-release/rustqec-${RELEASE_TAG}-${RELEASE_TARGET}.tar.gz"
          root="$(basename "$archive" .tar.gz)"
          mkdir -p envelope-evidence
          python3 tooling/tools/check_installed_envelope.py \
            --bin-dir "$PWD/extracted/$root/bin" \
            --matrix tooling/docs/envelope-support.json \
            --target "$RELEASE_TARGET" \
            --archive "$archive" \
            --source-sha "$SOURCE_SHA" \
            --expect-ilp \
            --out "envelope-evidence/installed-${RELEASE_TARGET}.json"
      - name: Upload installed-envelope report
        uses: actions/upload-artifact@v4
        with:
          name: envelope-installed-${{ matrix.target }}
          path: envelope-evidence/
          if-no-files-found: error

  envelope-evidence:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout immutable build source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          path: source
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r source/benchmarks/atom_loss/requirements.txt
      - name: Build the envelope CLI from the candidate revision
        working-directory: source
        run: cargo build --release --locked -p rustqec-cli --features benchmark-tools,ilp --bin rustqec --example export_matching_benchmark --example export_decoder_oracle
      - name: Generate the revision-bound evidence bundle
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p envelope-evidence
          python3 tools/check_envelope_support.py \
            --binary target/release/rustqec \
            --matrix docs/envelope-support.json \
            --out envelope-evidence/support.json
          python3 -m benchmarks.atom_loss.readiness_correctness \
            --binary target/release/rustqec \
            --matrix docs/envelope-support.json \
            --profile full \
            --out envelope-evidence/correctness.json
          python3 -m benchmarks.atom_loss.readiness_resources \
            --binary target/release/rustqec \
            --matrix docs/envelope-support.json \
            --profile smoke \
            --out envelope-evidence/resources.json
          python3 -m benchmarks.atom_loss.readiness_resources \
            --verify benchmarks/atom_loss/readiness/resources/manifest.json
          python3 -m benchmarks.atom_loss.mle_candidate_resources \
            --binary target/release/rustqec \
            --plan docs/envelope-mle-scope.json \
            --out envelope-evidence/mle-resources.json
          python3 -m benchmarks.atom_loss.mle_candidate_resources \
            --verify envelope-evidence/mle-resources.json
      - name: Upload generated envelope evidence
        uses: actions/upload-artifact@v4
        with:
          name: envelope-generated
          path: source/envelope-evidence/
          if-no-files-found: error

  envelope-release-gate:
    needs: [prepare, envelope-evidence, envelope-installed]
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: tooling
      - name: Checkout immutable MLE scope source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
      - name: Download generated evidence
        uses: actions/download-artifact@v4
        with:
          name: envelope-generated
          path: evidence
      - name: Download installed-envelope reports
        uses: actions/download-artifact@v4
        with:
          pattern: envelope-installed-*
          path: evidence
          merge-multiple: true
      - name: Aggregate the envelope release decision
        run: |
          set -euo pipefail
          mkdir -p gate-out
          python3 tooling/tools/check_envelope_release.py \
            --evidence-dir evidence \
            --matrix tooling/docs/envelope-support.json \
            --policy tooling/docs/envelope-compatibility-policy.md \
            --mle-scope "$PWD/source/docs/envelope-mle-scope.json" \
            --candidate-revision "$SOURCE_SHA" \
            --out gate-out/release-gate.json
      - name: Prove the gate rejects defective bundles
        run: |
          python3 tooling/tools/check_envelope_release.py \
            --self-test \
            --evidence-dir evidence \
            --matrix tooling/docs/envelope-support.json \
            --policy tooling/docs/envelope-compatibility-policy.md \
            --mle-scope "$PWD/source/docs/envelope-mle-scope.json" \
            --candidate-revision "$SOURCE_SHA"
      - name: Upload the envelope release decision
        uses: actions/upload-artifact@v4
        with:
          name: envelope-release-gate
          path: gate-out/
          if-no-files-found: error

  envelope-publication:
    needs: [prepare, aggregate, envelope-release-gate]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Checkout immutable MLE scope source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
      - name: Download the staged release bundle
        uses: actions/download-artifact@v4
        with:
          name: native-release-bundle
          path: staged-release
      - name: Download generated envelope evidence
        uses: actions/download-artifact@v4
        with:
          name: envelope-generated
          path: evidence
      - name: Download installed-envelope reports
        uses: actions/download-artifact@v4
        with:
          pattern: envelope-installed-*
          path: evidence
          merge-multiple: true
      - name: Download the envelope release decision
        uses: actions/download-artifact@v4
        with:
          name: envelope-release-gate
          path: gate-out
      - name: Assemble the version-bound support evidence bundle
        run: |
          set -euo pipefail
          python3 tooling/tools/check_envelope_publication.py build \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --release-manifest staged-release/release-manifest.json \
            --archives-dir staged-release \
            --evidence-dir evidence \
            --gate-report gate-out/release-gate.json \
            --matrix tooling/docs/envelope-support.json \
            --policy tooling/docs/envelope-compatibility-policy.md \
            --mle-scope source/docs/envelope-mle-scope.json \
            --retained-resources tooling/benchmarks/atom_loss/readiness/resources \
            --out-dir publication
      - name: Round-trip verify the bundle against the staged release
        run: |
          set -euo pipefail
          mkdir audit
          cp staged-release/rustqec-*.tar.gz staged-release/SHA256SUMS \
            staged-release/release-manifest.json audit/
          cp publication/* audit/
          supported="$(tar -xzOf publication/envelope-support-evidence-*.tar.gz \
            --wildcards '*/publication.json' | \
            python3 -c 'import json, sys; print(" ".join(json.load(sys.stdin)["supported_decoders"]))')"
          expect=()
          for decoder in $supported; do
            expect+=(--expect-decoder "$decoder")
          done
          python3 tooling/tools/check_envelope_publication.py \
            --release-dir audit "${expect[@]}"
      - name: Prove the verifier rejects defective bundles
        run: python3 tooling/tools/check_envelope_publication.py --self-test
      - name: Upload the envelope support evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: envelope-publication
          path: publication/
          if-no-files-found: error

  verify-linux-runtime:
    needs: [prepare, aggregate]
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install runtime verifier only
        run: apt-get update && apt-get install -y python3
      - name: Download staged release bundle without a source checkout
        uses: actions/download-artifact@v4
        with:
          name: native-release-bundle
          path: staged-release
      - name: Verify and execute the Linux archive
        shell: bash
        run: |
          set -euo pipefail
          test ! -e source
          test ! -e quickstart-tooling
          test ! -e Cargo.toml
          test ! -e target
          archive="staged-release/rustqec-${{ needs.prepare.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz"
          python3 staged-release/verify_release_archive.py \
            --archive "$archive" \
            --checksums staged-release/SHA256SUMS \
            --manifest staged-release/release-manifest.json \
            --expected-tag "${{ needs.prepare.outputs.tag }}" > linux-positive.log
          cat linux-positive.log
          root="$(basename "$archive" .tar.gz)"
          PYTHONPATH=staged-release python3 - "$archive" "$root" <<'PY'
          import sys
          from pathlib import Path
          from verify_release_archive import safe_extract
          safe_extract(Path(sys.argv[1]), Path("extracted"), sys.argv[2])
          PY
          PATH='' /usr/bin/python3 staged-release/check_installed_quickstart.py \
            --bin-dir "$PWD/extracted/$root/bin" | tee linux-quickstart.log
          mkdir tampered
          cp "$archive" "tampered/$(basename "$archive")"
          printf tampered >> "tampered/$(basename "$archive")"
          if python3 staged-release/verify_release_archive.py \
            --archive "tampered/$(basename "$archive")" \
            --checksums staged-release/SHA256SUMS \
            --manifest staged-release/release-manifest.json \
            --expected-tag "${{ needs.prepare.outputs.tag }}" > linux-tamper.log 2>&1; then
            echo "tampered archive unexpectedly passed" >&2
            exit 1
          fi
          grep 'archive SHA-256 mismatch' linux-tamper.log
          if python3 staged-release/verify_release_archive.py \
            --archive "$archive" \
            --checksums staged-release/SHA256SUMS \
            --manifest staged-release/release-manifest.json \
            --expected-tag wrong-tag > linux-wrong-tag.log 2>&1; then
            echo "wrong tag unexpectedly passed" >&2
            exit 1
          fi
          grep 'release tag mismatch' linux-wrong-tag.log
          uname -a > linux-runtime-identity.txt
          cat /etc/os-release >> linux-runtime-identity.txt
      - name: Upload Linux clean-runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-evidence-x86_64-unknown-linux-gnu
          path: linux-*

  verify-macos-runtime:
    needs: [prepare, aggregate]
    runs-on: macos-15
    steps:
      - name: Download staged release bundle without a source checkout
        uses: actions/download-artifact@v4
        with:
          name: native-release-bundle
          path: staged-release
      - name: Verify and execute the macOS archive with a system-only binary PATH
        run: |
          set -euo pipefail
          test ! -e source
          test ! -e quickstart-tooling
          test ! -e Cargo.toml
          test ! -e target
          python_bin="$(command -v python3)"
          developer_stub="$RUNNER_TEMP/no-developer-tools"
          mkdir "$developer_stub"
          archive="staged-release/rustqec-${{ needs.prepare.outputs.tag }}-aarch64-apple-darwin.tar.gz"
          DEVELOPER_DIR="$developer_stub" PATH='' "$python_bin" staged-release/verify_release_archive.py \
            --archive "$archive" \
            --checksums staged-release/SHA256SUMS \
            --manifest staged-release/release-manifest.json \
            --expected-tag "${{ needs.prepare.outputs.tag }}" > macos-positive.log
          cat macos-positive.log
          root="$(basename "$archive" .tar.gz)"
          DEVELOPER_DIR="$developer_stub" PATH='' PYTHONPATH=staged-release "$python_bin" - "$archive" "$root" <<'PY'
          import sys
          from pathlib import Path
          from verify_release_archive import safe_extract
          safe_extract(Path(sys.argv[1]), Path("extracted"), sys.argv[2])
          PY
          DEVELOPER_DIR="$developer_stub" PATH='' "$python_bin" staged-release/check_installed_quickstart.py \
            --bin-dir "$PWD/extracted/$root/bin" | tee macos-quickstart.log
          mkdir tampered
          cp "$archive" "tampered/$(basename "$archive")"
          printf tampered >> "tampered/$(basename "$archive")"
          if DEVELOPER_DIR="$developer_stub" PATH='' "$python_bin" staged-release/verify_release_archive.py \
            --archive "tampered/$(basename "$archive")" \
            --checksums staged-release/SHA256SUMS \
            --manifest staged-release/release-manifest.json \
            --expected-tag "${{ needs.prepare.outputs.tag }}" > macos-tamper.log 2>&1; then
            echo "tampered archive unexpectedly passed" >&2
            exit 1
          fi
          grep 'archive SHA-256 mismatch' macos-tamper.log
          if DEVELOPER_DIR="$developer_stub" PATH='' "$python_bin" staged-release/verify_release_archive.py \
            --archive "$archive" \
            --checksums staged-release/SHA256SUMS \
            --manifest staged-release/release-manifest.json \
            --expected-tag wrong-tag > macos-wrong-tag.log 2>&1; then
            echo "wrong tag unexpectedly passed" >&2
            exit 1
          fi
          grep 'release tag mismatch' macos-wrong-tag.log
          { uname -a; sw_vers; echo "clean PATH="; echo "empty DEVELOPER_DIR=$developer_stub"; } > macos-runtime-identity.txt
      - name: Upload macOS clean-runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-evidence-aarch64-apple-darwin
          path: macos-*

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [prepare, checker-tests, verify-linux-runtime, verify-macos-runtime, envelope-release-gate, envelope-publication]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Download the release-gated verified bundle
        uses: actions/download-artifact@v4
        with:
          name: native-release-bundle
          path: staged-release
      - name: Download the envelope support evidence bundle
        uses: actions/download-artifact@v4
        with:
          name: envelope-publication
          path: publication
      - name: Reconcile the evidence bundle with the staged release before upload
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir audit
          cp staged-release/rustqec-*.tar.gz staged-release/SHA256SUMS \
            staged-release/release-manifest.json audit/
          cp publication/* audit/
          supported="$(tar -xzOf publication/envelope-support-evidence-*.tar.gz \
            --wildcards '*/publication.json' | \
            python3 -c 'import json, sys; print(" ".join(json.load(sys.stdin)["supported_decoders"]))')"
          expect=()
          for decoder in $supported; do
            expect+=(--expect-decoder "$decoder")
          done
          python3 tooling/tools/check_envelope_publication.py \
            --release-dir audit "${expect[@]}"
      - name: Attach new assets to the existing release without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
          existing_assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in staged-release/rustqec-*.tar.gz staged-release/SHA256SUMS staged-release/release-manifest.json staged-release/verify_release_archive.py publication/envelope-support-evidence-*.tar.gz publication/envelope-support-evidence-*.tar.gz.sha256; do
            if grep -Fxq "$(basename "$asset")" <<< "$existing_assets"; then
              echo "release asset already exists; refusing to overwrite: $(basename "$asset")" >&2
              exit 1
            fi
          done
          if grep -Fxq "envelope-support-verification-${TAG}.json" <<< "$existing_assets"; then
            echo "release verification marker already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release upload "$TAG" \
            staged-release/rustqec-*.tar.gz \
            staged-release/SHA256SUMS \
            staged-release/release-manifest.json \
            staged-release/verify_release_archive.py \
            publication/envelope-support-evidence-*.tar.gz \
            publication/envelope-support-evidence-*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY"
      - name: Verify the published assets and enable the website claim
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir published-audit
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published-audit \
            --pattern 'rustqec-*.tar.gz' \
            --pattern 'SHA256SUMS' \
            --pattern 'release-manifest.json' \
            --pattern 'envelope-support-evidence-*.tar.gz' \
            --pattern 'envelope-support-evidence-*.tar.gz.sha256'
          supported="$(tar -xzOf published-audit/envelope-support-evidence-*.tar.gz \
            --wildcards '*/publication.json' | \
            python3 -c 'import json, sys; print(" ".join(json.load(sys.stdin)["supported_decoders"]))')"
          expect=()
          for decoder in $supported; do
            expect+=(--expect-decoder "$decoder")
          done
          marker="publication/envelope-support-verification-${TAG}.json"
          python3 tooling/tools/check_envelope_publication.py \
            --release-dir published-audit "${expect[@]}" --marker-out "$marker"
          evidence_sha="$(sha256sum published-audit/envelope-support-evidence-*.tar.gz | awk '{print $1}')"
          marker_sha="$(sha256sum "$marker" | awk '{print $1}')"
          supported_csv="${supported// /,}"
          marker_label="rustqec-envelope-v2;t=${TAG};s=${SOURCE_SHA};e=${evidence_sha};m=${marker_sha};d=${supported_csv};ok=1"
          test "${#marker_label}" -le 255
          gh release upload "$TAG" "$marker#$marker_label" --repo "$GITHUB_REPOSITORY"
