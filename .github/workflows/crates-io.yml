name: Crates.io readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-readiness-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  minimal-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [rstim, qec-code, qec-ilp-core, rmatching, rbposd, rsinter, rilpqec]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimal-${{ matrix.package }}
      - uses: actions/setup-python@v5
        if: matrix.package == 'rstim'
        with:
          python-version: '3.12'
      - name: Install reference simulator for cross-validation tests
        if: matrix.package == 'rstim'
        run: python3 -m pip install stim
      - name: Install native solver build prerequisites
        if: matrix.package == 'rilpqec'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang libclang-dev
      - name: Test each library without workspace feature unification
        run: cargo test --locked -p ${{ matrix.package }} --no-default-features
  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install prerequisites for the opt-in packaged solver check
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check publication contracts
        run: |
          python3 -m unittest tools.test_check_crates_io tools.test_check_rmatching_readme tools.test_check_installed_quickstart tools.test_check_crate_consumer
          python3 tools/check_crates_io.py
          python3 tools/check_rbposd_repo.py
          python3 tools/check_rsinter_repo_configs.py
      - name: Exercise eight unpacked packages, installed CLIs, and decoder replay
        run: python3 tools/check_crate_consumer.py
      - name: Preserve reviewed crate archives
        uses: actions/upload-artifact@v4
        with:
          name: crate-consumer-packages
          path: target/package/*.crate
          if-no-files-found: error
