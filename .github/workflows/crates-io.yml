name: Crates.io readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-readiness-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install prerequisites for the opt-in packaged solver check
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check publication contracts
        run: |
          python3 -m unittest tools.test_check_crates_io tools.test_check_installed_quickstart tools.test_check_crate_consumer
          python3 tools/check_crates_io.py
      - name: Exercise unpacked libraries and installed default CLI
        run: python3 tools/check_crate_consumer.py
      - name: Preserve reviewed crate archives
        uses: actions/upload-artifact@v4
        with:
          name: crate-consumer-packages
          path: target/package/*.crate
          if-no-files-found: error
