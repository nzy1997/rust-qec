name = "surface_decoder"
version = 1
mode = "independent"

[[runner]]
name = "rmatching"
language = "rust"
impl_key = "rmatching"

[runner.params]
distance = [3, 5]
rounds = [3, 5]
p = [0.002, 0.005, 0.010]
max_shots = 10000
max_errors = 200
batch_size = 256

