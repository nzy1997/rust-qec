source_commit = "9e225958f9ae1f9c33d1b9a012b7ec4392b43aef"
source_line_start = 171
source_line_end = 180
circuit = """
H 0
CNOT 0 1
SQRT_X 0 1
M 0 1
"""
shots = 10000
tolerance = 1e-9
source_expression = { "10" = "0.5", "01" = "0.5" }
expected_distribution = { "10" = 0.5, "01" = 0.5 }

