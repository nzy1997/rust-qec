schema = 1
bundle = "rstim-publication-evidence"

# Publication evidence contract (issue #601). The checker
# tools/check_publication_benchmark_evidence.py validates structural integrity
# of every run under results/ and evaluates the readiness gates derived from
# this contract. Expensive campaigns run offline; only the checker runs in CI.
[contract]
declared_seeds = [7, 11, 17, 23, 31]
confidence = 0.95
min_scale_levels = 3
min_hardware_profiles = 2
min_warmups = 3
min_timing_repetitions = 10

[report]
# report.md and readiness.json are regenerated by this command; the checker
# hashes nothing by hand and the committed copies must match byte-for-byte.
generator_command = "python3 tools/check_publication_benchmark_evidence.py --manifest benchmarks/publication_evidence/manifest.toml --results-dir benchmarks/publication_evidence/results --report-out benchmarks/publication_evidence/report.md --readiness-out benchmarks/publication_evidence/readiness.json"

claim_limits = [
  "This bundle supports repository-scoped benchmark evidence only; it does not claim universal Stim parity, decoder ordering, or RSMP compression beyond the measured matrix.",
  "Runs imported from historical artifacts record production_provenance.recorded = false where the original commit, hardware, or seed protocol was not captured; they are secondary diagnostics until re-measured under the declared protocol.",
  "Error-budget-stopped rows (surface and BB legacy imports) are secondary diagnostics and must not be cited as the primary fixed-shot logical-error curve.",
  "Wall-clock claims require two identified physical hosts; only one identified host (hw01-apple-m4-macos, aarch64-apple-darwin) is present, so no cross-platform timing claim is currently supported.",
]

external_dependencies = [
  "Issue #379 (site provenance schema): this bundle reuses the portable repository-relative path + sha256 conventions; the site-facing schema integration lands with #379.",
  "Issue #600 (RSMP b8/r8/ptb64 Stim result-format baselines): the rsmp-v1 family reserves required_baselines b8/r8/ptb64; the b8 row is derived from the pinned measurement stream, r8 and ptb64 rows are filled once #600 merges.",
]

# Hardware profiles referenced by run environments. hw01 is the identified
# aarch64-apple-darwin host used for the regenerated RSMP evidence. The
# x86_64-unknown-linux-gnu profile is required by the contract but not yet
# measured; readiness reports it as a gap until the offline campaign runs.
[[hardware_profiles]]
id = "hw01-apple-m4-macos"
cpu_class = "aarch64-apple-darwin"
cpu_model = "Apple M4"
physical_cores = 10
logical_cores = 10
ram_gb = 32
os = "macOS (Darwin 25.6.0)"
rust_target = "aarch64-apple-darwin"
identified = true

[[hardware_profiles]]
id = "hw-legacy-unidentified"
cpu_class = "unidentified"
cpu_model = "not recorded in source artifact"
physical_cores = 0
logical_cores = 0
ram_gb = 0
os = "not recorded in source artifact"
rust_target = "not recorded"
identified = false

[[families]]
id = "surface-decoder-compare"
seed_policy = "declared"
timing = true
required_baselines = ["pymatching", "ldpc_bposd", "ilpqec"]
required_ablations = ["rbposd_lsd_order1", "rbposd_product_sum_serial"]

[[families.scale_axes]]
name = "distance"
required_levels = ["3", "5", "7"]

[[families.scale_axes]]
name = "p"
required_levels = ["0.002", "0.005", "0.010"]

[[families]]
id = "bb-circuit-bposd-compare"
seed_policy = "declared"
timing = false
required_baselines = ["ldpc_bposd", "bravyi_reference"]
required_ablations = ["fixed_shot_reference"]

[[families.scale_axes]]
name = "code_id"
required_levels = ["bb72", "bb90", "bb144"]

[[families.scale_axes]]
name = "p"
required_levels = ["0.003", "0.004", "0.005", "0.006"]

[[families]]
id = "rstim-vs-stim-simulator"
seed_policy = "declared"
timing = true
required_baselines = ["stim_cli"]
required_ablations = ["frame_noise_baseline"]

[[families.scale_axes]]
name = "workload"
required_levels = ["stim_surface_d3_r3", "stim_surface_d5_r5", "stim_surface_d11_r100"]

[[families]]
id = "rsmp-v1"
seed_policy = "declared"
timing = false
required_baselines = ["b8", "r8", "ptb64"]
required_ablations = ["fixed_codec"]

[[families.scale_axes]]
name = "shots"
required_levels = ["256", "1024", "4096"]

[[families]]
id = "qec-code-random-window"
seed_policy = "declared"
timing = false
required_baselines = ["codedistance_pypi"]
required_ablations = ["no_pruning"]

[[families.scale_axes]]
name = "case_id"
required_levels = ["steane_full", "surface_rotated_d5_full", "toric_d5_full", "bb72_full", "bb144_full"]
