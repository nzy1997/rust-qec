[package]
name = "surface_decoder_compare_bridge"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
gurobi = ["rsinter/gurobi", "rilpqec/gurobi"]

[dependencies]
rbposd = { path = "../../../rbposd" }
qec-ilp-core = { path = "../../../qec-ilp-core", features = ["highs"] }
rilpqec = { path = "../../../rilpqec" }
rsinter = { path = "../../../rsinter", features = ["full"] }
rstim = { path = "../../../rstim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
