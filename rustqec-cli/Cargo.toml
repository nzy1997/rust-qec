[package]
name = "rustqec-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rustqec-cli"
description = "Command-line tools for quantum error-correction circuit simulation and decoding"
publish = ["crates-io"]
include = [
    "/src/**",
    "/tests/**",
    "/README.md",
    "/LICENSE",
    "/Cargo.toml",
    "/Cargo.lock",
]

[features]
default = []
ilp = ["dep:qec-ilp-core", "qec-ilp-core/highs"]

[[bin]]
name = "rustqec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
qec-ilp-core = { version = "0.1.0", path = "../qec-ilp-core", optional = true }
rmatching = { version = "0.2.1", path = "../rmatching" }
rstim = { version = "0.2.1", path = "../rstim", features = ["codegen-css"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
renvelope = { path = "../renvelope" }
zstd = "0.13"
