[package]
name = "rustqec-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "rustqec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rstim = { path = "../rstim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
