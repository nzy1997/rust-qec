[package]
name = "rustqec-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "rustqec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
qec-ilp-core = { path = "../qec-ilp-core" }
rmatching = { path = "../rmatching" }
rstim = { path = "../rstim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
renvelope = { path = "../renvelope" }
