[package]
name = "atom-loss-envelope"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Experimental Envelope-MLE decoder for explicit atom-loss envelopes"

[dependencies]
clap = { version = "4", features = ["derive"] }
qec-ilp-core = { path = "../../qec-ilp-core" }
rmatching = { path = "../../rmatching" }
rstim = { path = "../../rstim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
