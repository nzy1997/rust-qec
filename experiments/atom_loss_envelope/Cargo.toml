[package]
name = "atom-loss-envelope"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Experimental Envelope-MLE decoder for explicit atom-loss envelopes"

[dependencies]
clap = { version = "4", features = ["derive"] }
qec-ilp-core = { path = "../../qec-ilp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
