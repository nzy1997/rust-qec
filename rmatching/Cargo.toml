[package]
name = "rmatching"
version = "0.3.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rmatching"
publish = ["crates-io"]
include = ["/src/**", "/tests/**", "/examples/**", "/doc/**", "/assets/**", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]
description = "Rust minimum-weight perfect-matching decoder for detector-error-model workflows"

[dev-dependencies]
rstim = { version = "0.3.0", path = "../rstim" }

[[bin]]
name = "rmatching_cli"
path = "src/bin/rmatching_cli.rs"
