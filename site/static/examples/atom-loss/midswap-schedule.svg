<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
<title id="title">Mid-SWAP round schedule</title><desc id="desc">After the first physical CX layer, exchange logical roles. Run the remaining layers with the new mapping, then loss-visible readout and reset of check roles.</desc>
<rect width="960" height="240" fill="#fcfaf7" rx="12"/>
<g font-family="system-ui,sans-serif" font-size="18" fill="#292826">
<g stroke="#d8c8ba" fill="#fff"><rect x="24" y="54" width="185" height="115" rx="8"/><rect x="263" y="54" width="195" height="115" rx="8" fill="#f7e8dd"/><rect x="511" y="54" width="185" height="115" rx="8"/><rect x="750" y="54" width="186" height="115" rx="8"/></g>
<g text-anchor="middle"><text x="116" y="91" font-weight="650">CX layer 0</text><text x="116" y="125" font-size="15">first physical layer</text><text x="360" y="91" font-weight="650">Exchange roles</text><text x="360" y="125" font-size="15">data ↔ check</text><text x="603" y="91" font-weight="650">CX layers 1–3</text><text x="603" y="125" font-size="15">updated wire mapping</text><text x="843" y="91" font-weight="650">MRL check roles</text><text x="843" y="125" font-size="15">flag, value, then reset</text></g>
<g fill="none" stroke="#ad4c20" stroke-width="3"><path d="M216 111h38m-9-7 9 7-9 7M466 111h37m-9-7 9 7-9 7M704 111h38m-9-7 9 7-9 7"/></g>
<text x="480" y="211" text-anchor="middle" font-size="15" fill="#6f6259">Physical wires remain fixed. The role exchange is not a literal SWAP instruction.</text>
</g></svg>