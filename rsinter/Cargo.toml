[package]
name = "rsinter"
version = "0.1.1"
edition = "2024"

[features]
default = []
gurobi = ["rilpqec/gurobi"]

[dependencies]
rstim = { path = "../rstim" }
rmatching = { path = "../rmatching", features = ["bench"] }
rbposd = { path = "../rbposd" }
rilpqec = { path = "../rilpqec" }
rand = "0.8"
rayon = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
toml = "0.8"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "line_series", "full_palette", "ttf"] }

[dev-dependencies]
qec-code = { path = "../qec-code" }
tempfile = "3"

[[bin]]
name = "rsinter"
path = "src/bin/rsinter.rs"
