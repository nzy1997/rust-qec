[package]
name = "rsinter"
version = "0.2.1"
edition = "2024"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rsinter"
description = "Experimental parallel sampling and decoder benchmark harness for RustQEC"
publish = false
include = ["/src/**", "/tests/**", "/examples/**", "/doc/**", "/assets/**", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]

[features]
default = []
rbposd-runner = ["dep:rbposd"]
rmatching-runner = ["dep:rmatching"]
ilp-runner = ["dep:rilpqec", "dep:qec-ilp-core"]
plotting = ["dep:plotters"]
full = ["rbposd-runner", "rmatching-runner", "ilp-runner", "plotting"]
gurobi = ["ilp-runner", "rilpqec/gurobi"]

[dependencies]
rstim = { version = "0.2.1", path = "../rstim" }
rmatching = { version = "0.2.1", path = "../rmatching", optional = true }
rbposd = { version = "0.2.1", path = "../rbposd", optional = true }
rilpqec = { version = "0.1.0", path = "../rilpqec", optional = true }
qec-ilp-core = { version = "0.1.0", path = "../qec-ilp-core", optional = true }
rand = "0.8"
rayon = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
toml = "0.8"
tempfile = "3"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "line_series", "full_palette", "ttf"], optional = true }

[dev-dependencies]
qec-code = { version = "0.1.0", path = "../qec-code" }

[[bin]]
name = "rsinter"
path = "src/bin/rsinter.rs"
