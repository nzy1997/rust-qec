[package]
name = "rsinter"
version = "0.1.0"
edition = "2024"

[dependencies]
rstim = { path = "../rstim" }
rand = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "line_series", "full_palette", "ttf"] }

[dev-dependencies]
tempfile = "3"
