name = "bb72_css_decoder"
version = 1
mode = "independent"

[[runner]]
name = "rmatching"
language = "rust"
impl_key = "rmatching"

[runner.params]
input_type = "css"
code_id = "bb72"
hx = "../css/bb72_hx.json"
hz = "../css/bb72_hz.json"
basis = "x"
rounds = [1]
p = [0.0]
schedule = "greedy"
observables = "../css/bb72_logicals_x.json"
max_shots = 4
max_errors = 4
batch_size = 4

[plot]
title = "BB72 CSS Decoder"

[plot.x]
field = "params.p"
scale = "linear"
label = "Physical Error Rate"

[plot.series]
group_by = ["runner", "params.code_id"]
label_template = "{runner} {params.code_id}"

[[plot.panel]]
metric = "metrics.logical_error_rate"
scale = "linear"
label = "Logical Error Rate"
