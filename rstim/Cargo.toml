[package]
name = "rstim"
version = "0.2.1"
edition = "2024"
license.workspace = true
rust-version.workspace = true
description = "Stim-aligned stabilizer circuit simulator and detector error model toolkit"

[features]
benchmark-telemetry = []

[dependencies]
rand = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
qec-code = { version = "0.1.0", path = "../qec-code" }
zstd = "0.13"
toml = "0.8"

[dev-dependencies]
proptest = "1"
tempfile = "3"
