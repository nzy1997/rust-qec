[package]
name = "rstim"
version = "0.3.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rstim"
publish = ["crates-io"]
include = ["/src/**", "/tests/**", "/examples/**", "/doc/**", "/assets/**", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]
description = "Stim-aligned stabilizer circuit simulator and detector error model toolkit"

[features]
default = []
benchmark-telemetry = []
benchmark-tools = ["dep:clap"]
cli = ["dep:clap"]
codegen-css = ["dep:qec-code"]
shot-viewer = []

[dependencies]
rand = "0.8"
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
qec-code = { version = "0.3.0", path = "../qec-code", optional = true }
zstd = "0.13"
toml = "0.8"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "rstim"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "rstim_compiled_steady_worker"
path = "src/bin/rstim_compiled_steady_worker.rs"
required-features = ["benchmark-tools"]

[[bin]]
name = "rstim_reference_build_worker"
path = "src/bin/rstim_reference_build_worker.rs"
required-features = ["benchmark-tools"]

[[test]]
name = "rstim_compiled_steady_worker"
required-features = ["benchmark-tools"]

[[test]]
name = "rstim_reference_build_worker"
required-features = ["benchmark-tools"]

[[test]]
name = "cli_analyze"
required-features = ["cli"]

[[test]]
name = "cli_coverage"
required-features = ["cli"]

[[test]]
name = "cli_feature_boundaries"
