[package]
name = "rstim"
version = "0.3.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rstim"
publish = ["crates-io"]
include = ["/src/**", "/tests/**", "/examples/**", "/doc/**", "/assets/**", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]
description = "Stim-aligned stabilizer circuit simulator and detector error model toolkit"

[features]
default = ["unified-cli", "codegen-css", "shot-viewer", "plotting"]
benchmark-telemetry = []
benchmark-tools = ["unified-cli"]
cli = ["dep:clap"]
unified-cli = ["cli", "dep:rmatching", "dep:tempfile"]
ilp = ["unified-cli", "dep:qec-ilp-core", "qec-ilp-core/highs"]
codegen-css = ["dep:qec-code"]
shot-viewer = []
plotting = ["dep:csv", "dep:plotters", "dep:tempfile"]

[dependencies]
rand = "0.8"
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
qec-code = { version = "0.3.0", path = "../qec-code", optional = true }
rmatching = { version = "0.3.0", path = "../rmatching", optional = true }
qec-ilp-core = { version = "0.3.0", path = "../qec-ilp-core", optional = true }
tempfile = { version = "3", optional = true }
zstd = "0.13"
toml = "0.8"
csv = { version = "1", optional = true }
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "full_palette"], optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
renvelope = { path = "../renvelope" }

[[bin]]
name = "rstim"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "rstim_compiled_steady_worker"
path = "src/bin/rstim_compiled_steady_worker.rs"
required-features = ["benchmark-tools"]

[[bin]]
name = "rstim_reference_build_worker"
path = "src/bin/rstim_reference_build_worker.rs"
required-features = ["benchmark-tools"]

[[example]]
name = "export_matching_benchmark"
required-features = ["benchmark-tools"]

[[example]]
name = "export_decoder_oracle"
required-features = ["benchmark-tools"]

[[example]]
name = "offline_matching_benchmark"
